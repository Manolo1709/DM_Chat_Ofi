server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La API va al contenedor del backend por la red interna de Compose
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La IA puede tardar hasta 30 s antes de usar la fórmula de respaldo
        proxy_read_timeout 45s;
        client_max_body_size 64k;
    }

    # Documentación interactiva de FastAPI (Swagger) para probar la API
    location ~ ^/(docs|openapi\.json)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Archivos con hash en el nombre: se pueden cachear mucho tiempo
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Una sola pantalla: cualquier otra ruta devuelve index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
