# =====================================================================
# supervisord.conf - Para Dockerfile.dev combined-dev stage
# Ejecuta Vite (frontend) y Uvicorn (backend) en un solo contenedor
# =====================================================================

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid

[program:vite]
command=npm run dev -- --host 0.0.0.0 --port 5173
directory=/app/frontend
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=VITE_USE_MOCK=false

[program:uvicorn]
command=uvicorn api.index:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/api --proxy-headers --forwarded-allow-ips=*
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED=1,LOG_ARCHIVO=true,LOG_LEVEL=DEBUG,APP_ENV=development