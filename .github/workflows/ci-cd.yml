# =====================================================================
# .github/workflows/ci-cd.yml - CI de La Taberna (solo pruebas)
# =====================================================================
# El despliegue no se hace aquí: la app corre en EC2 con Docker Compose
# (ver aws/EC2.md) y se actualiza con `git pull` + `docker compose up`.
# Las pruebas usan valores ficticios; no hace falta ningún secreto.
# =====================================================================

name: CI - La Taberna

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Permite ejecución manual

jobs:
  test:
    name: Test (Python + Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pytest-cov

      - name: Run backend tests
        env:
          LLM_API_KEY: test-key
          LLM_BASE_URL: https://ia.test/v1
          LLM_MODEL: test-model
          LOG_ARCHIVO: false
        run: |
          pytest api/ -v --cov=api --cov-report=term --cov-fail-under=80

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node deps
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Typecheck frontend
        run: npm run typecheck
